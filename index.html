<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBot Pro - AI Logistics Assistant</title>
 
    <!-- Tailwind CSS CDN — fine for development/local use.
         For production, replace with the Tailwind CLI or PostCSS plugin:
         https://tailwindcss.com/docs/installation -->
    <script src="https://cdn.tailwindcss.com"></script>
 
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center p-4">
 
    <!-- Decorative Background Glows -->
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-900/20 rounded-full blur-[120px] z-[-1]"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-900/20 rounded-full blur-[120px] z-[-1]"></div>
 
    <!-- Main Chat Panel -->
    <div class="w-full max-w-lg glass-panel rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col relative h-[90vh] max-h-[850px]">
 
        <!-- ── Header ── -->
        <div class="bg-slate-900/40 backdrop-blur-md p-6 flex items-center justify-between border-b border-white/5 z-10">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <!-- Bot Avatar -->
                    <div class="w-12 h-12 bg-indigo-600 rounded-2xl rotate-3 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                            <path d="m3.3 7 8.7 5 8.7-5"/>
                            <path d="M12 22V12"/>
                        </svg>
                    </div>
                    <!-- Online indicator -->
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-slate-900 rounded-full"></div>
                </div>
 
                <div>
                    <h1 class="text-white font-bold text-lg tracking-tight">TrackBot Pro</h1>
                    <div class="flex items-center gap-1.5">
                        <span id="status-tag"
                              class="text-[11px] font-semibold text-indigo-400 uppercase tracking-widest bg-indigo-500/10 px-2 py-0.5 rounded-md">
                            AI Active (Groq)
                        </span>
                    </div>
                </div>
            </div>
        </div>
 
        <!-- ── Chat History ── -->
        <div id="chat-box" class="chat-container overflow-y-auto p-6 space-y-6"></div>
 
        <!-- ── Quick-Action Suggestions ── -->
        <div id="quick-actions" class="px-6 py-2 flex gap-3 overflow-x-auto no-scrollbar">
            <button data-action="Track Order #12345"
                    class="quick-btn action-btn whitespace-nowrap px-4 py-2 rounded-2xl text-xs font-semibold shadow-sm">
                📦 Track #12345
            </button>
            <button data-action="Track Order #ABCDE"
                    class="quick-btn action-btn whitespace-nowrap px-4 py-2 rounded-2xl text-xs font-semibold shadow-sm">
                📍 Track #ABCDE
            </button>
            <button data-action="Need help"
                    class="quick-btn action-btn whitespace-nowrap px-4 py-2 rounded-2xl text-xs font-semibold shadow-sm">
                ❓ Help
            </button>
        </div>
 
        <!-- ── Input Area ── -->
        <div class="p-6 bg-slate-900/40 border-t border-white/5 backdrop-blur-md">
            <form id="chat-form" class="relative flex items-center">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Enter Order ID or ask status..."
                    class="w-full bg-slate-800/50 border border-white/10 rounded-[1.5rem] pl-6 pr-14 py-4 text-sm text-white placeholder-slate-500 focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/50 outline-none transition-all shadow-inner"
                    autocomplete="off"
                >
                <button
                    type="submit"
                    id="send-btn"
                    class="absolute right-2 bg-indigo-600 text-white p-3 rounded-2xl hover:bg-indigo-700 transition-all active:scale-90 disabled:bg-slate-700 disabled:text-slate-500"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="m22 2-7 20-4-9-9-4Z"/>
                        <path d="M22 2 11 13"/>
                    </svg>
                </button>
            </form>
            <p class="text-[10px] text-center text-slate-500 mt-3 font-medium">
                Enterprise AI Build • Groq Llama 3 Integration
            </p>
        </div>
 
    </div><!-- /Main Chat Panel -->
 
    <!-- External Script -->
    <script src="script.js"></script>
</body>
</html>
